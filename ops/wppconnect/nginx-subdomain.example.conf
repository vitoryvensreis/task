# Exemplo para o vhost HTTPS de wppconnect.escotilhaprodutora.com.
# Use dentro do server {} HTTPS criado pelo painel/Nginx.
# O container escuta SOMENTE em 127.0.0.1:21465.

client_max_body_size 64m;

location / {
    proxy_pass http://127.0.0.1:21465;
    proxy_http_version 1.1;

    # Necessário para Socket.IO/WebSocket do WPPConnect.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 15s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    proxy_buffering off;
    proxy_request_buffering off;
}

# O Manager ficará desabilitado em produção.
location ^~ /manager/ {
    return 404;
}
