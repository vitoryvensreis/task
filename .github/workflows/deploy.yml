      - name: Health check pós-deploy
        if: ${{ !cancelled() && steps.backup.outcome == 'success' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
            set -euo pipefail
            HEALTH_URL="$(php -r '$c=require $argv[1]; echo rtrim((string)($c["base_url"]??""),"/")."/health.php";' "$DEPLOY_PATH/config/config.php")"
            EXPECTED_SCHEMA="$(php -r 'require $argv[1]."/app/bootstrap.php"; echo (string)Migrations::CURRENT_VERSION;' "$DEPLOY_PATH")"
            [ -n "$HEALTH_URL" ] || { echo "ERRO: health URL vazia."; exit 1; }
            [ -n "$EXPECTED_SCHEMA" ] || { echo "ERRO: schema esperado vazio."; exit 1; }

            for attempt in 1 2 3 4 5; do
              RESPONSE="$(curl --fail --silent --show-error --max-time 20 "$HEALTH_URL" 2>/dev/null || true)"
              if [ -n "$RESPONSE" ] && php -r '$j=json_decode($argv[1],true);$expected=(string)$argv[2]; exit(is_array($j) && ($j["status"]??null)==="ok" && ($j["database"]??false)===true && ($j["installed"]??false)===true && (string)($j["schema"]??"")===$expected ? 0 : 1);' "$RESPONSE" "$EXPECTED_SCHEMA"; then
                echo "Health check OK na tentativa $attempt."
                echo "$RESPONSE"
                exit 0
              fi
              echo "Tentativa $attempt/5 falhou. Aguardando 3 segundos..."
              sleep 3
            done

            echo "ERRO: health check pós-deploy falhou."
            exit 1
          REMOTE
