name: Deploy TaskEsc

permissions:
  contents: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: taskesc-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validar código
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, curl, openssl, fileinfo, mbstring, zip, redis
          coverage: none

      - name: Vendorizar SDK oficial Centrifugo
        run: bash bin/vendor-centrifuge-js.sh

      - name: Validar sintaxe PHP
        run: |
          set -e
          find app bin public config tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validar isolamento e fallback realtime
        run: |
          set -e
          php tests/ai-whatsapp-fast-path.php
          php tests/ai-admin-approval.php
          php tests/ai-finance-only.php
          php tests/ai-whatsapp-group-trigger.php
          php tests/ai-agenda-config.php
          php tests/realtime.php
          php tests/ai-whatsapp-providers.php
          php tests/wppconnect-contract.php
          php tests/automation-contract.php
          python3 -m py_compile ops/realtime-step1.py ops/realtime-step3.py ops/realtime-step4.py ops/automation-worker.py ops/ai-whatsapp-worker.py ops/wppconnect-webhook-probe.py
          python3 tests/realtime-ops.py
          rm -rf ops/__pycache__

      - name: Validar JavaScript
        run: |
          set -e
          node --check public/assets/app.js
          node --check public/assets/ux-v3.js
          node --check public/assets/taskesc-icons.js
          node --check public/assets/realtime-client.js
          node tests/realtime-frontend.mjs
          node tests/automation-frontend.mjs
          node tests/automation-pan.mjs
          node tests/ai-usage-frontend.mjs
          node --check public/assets/vendor/centrifuge-5.7.4.js
          node --check public/service-worker.js
          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('public/assets/app.js','utf8');
          const html=fs.readFileSync('public/index.php','utf8');
          if(html.includes('>\\n  <link') || html.includes('</script>\\n  <script')){
            console.error('ERRO: texto literal \\n encontrado entre assets do index.php');
            process.exit(1);
          }
          const bad=[...src.matchAll(/(^|[^$])\$\([^)]*\)\.forEach/g)].map(m=>m[0].trim());
          if(bad.length){
            console.error('ERRO: seletor único $() usado com forEach:',bad);
            process.exit(1);
          }
          if(!src.includes('data-preview-close') || src.includes("x.onclick=()=>openDemand(d.id)")){
            console.error('ERRO: fechamento do preview de arquivos regrediu.');
            process.exit(1);
          }
          if(!html.includes('/assets/vendor/centrifuge-5.7.4.js') || !html.includes('/assets/realtime-client.js')){
            console.error('ERRO: cliente realtime local não está carregado.');
            process.exit(1);
          }
          if(/unpkg\.com\/centrifuge|cdn\.jsdelivr\.net.*centrifuge/i.test(html)){
            console.error('ERRO: CDN externo de Centrifugo não permitido.');
            process.exit(1);
          }
          NODE

      - name: Gerar ZIP completo
        run: |
          set -e
          rm -f "/tmp/taskesc-realtime-full.zip" "taskesc-realtime-full.zip"
          zip -qr "/tmp/taskesc-realtime-full.zip" . \
            -x '.git/*' \
               'config/config.php' \
               'storage/sessions/*' \
               'storage/logs/*'
          cp "/tmp/taskesc-realtime-full.zip" "taskesc-realtime-full.zip"

      - name: Publicar ZIP da versão
        uses: actions/upload-artifact@v4
        with:
          name: taskesc-realtime-full
          path: taskesc-realtime-full.zip
          if-no-files-found: error
          retention-days: 7

  outbox-tests:
    name: Outbox (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: MySQL 8
            image: mysql:8.0
          - database: MariaDB 10.11
            image: mariadb:10.11
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: taskesc-ci-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: taskesc_test
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --silent -h localhost -ptaskesc-ci-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, curl
          coverage: none
      - name: Testar migração e transações Outbox
        env:
          OUTBOX_TEST_PORT: ${{ job.services.database.ports['3306'] }}
        run: |
          php tests/outbox.php
          php tests/realtime-worker.php
          php tests/realtime-auth.php
          php tests/realtime-business-events.php
          php tests/realtime-domain.php
          php tests/wppconnect-realtime.php
          php tests/automation-core.php
          php tests/google-health.php
          php tests/chat.php
          php tests/ai-whatsapp-inbox.php
          php tests/ai-whatsapp-access.php
          php tests/ai-whatsapp-tools.php
          php tests/saas-foundation.php
          php tests/saas-domain.php
          php tests/saas-children.php
          php tests/saas-writes.php

  deploy:
    name: Deploy na VPS
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [validate, outbox-tests]

    steps:
      - name: Baixar repositório para snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar SDK oficial Centrifugo local
        run: bash bin/vendor-centrifuge-js.sh

      - name: Configurar acesso SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Diagnosticar WhatsApp antes de reiniciar o worker (somente leitura)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        continue-on-error: true
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
            set -euo pipefail
            echo "TaskEsc AI WhatsApp: snapshot PRE-DEPLOY UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            systemctl is-active taskesc-ai-whatsapp-worker.service || true
            systemctl show taskesc-ai-whatsapp-worker.service -p ActiveState -p SubState -p NRestarts -p ExecMainStatus --no-pager || true
            cd "$DEPLOY_PATH"
            php bin/ai-whatsapp-diagnose.php || true
          REMOTE

      - name: Backup obrigatório pré-deploy
        id: backup
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p predeploy-backup

          RESULT="$(ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
            set -euo pipefail

            cd "$DEPLOY_PATH"
            [ -d .git ] || { echo "ERRO: DEPLOY_PATH não aponta para um repositório Git." >&2; exit 1; }
            [ -f config/config.php ] || { echo "ERRO: config/config.php não encontrado." >&2; exit 1; }

            PROD_COMMIT="$(git rev-parse HEAD)"
            PROD_SHORT="$(git rev-parse --short=12 HEAD)"
            TS="$(date -u +%Y%m%dT%H%M%SZ)"
            BACKUP_DIR="$DEPLOY_PATH/storage/backups"
            mkdir -p "$BACKUP_DIR"
            chmod 700 "$BACKUP_DIR"

            BASENAME="taskesc-predeploy-${TS}-${PROD_SHORT}"
            BACKUP_FILE="$BACKUP_DIR/${BASENAME}.sql.gz"
            SHA_FILE="$BACKUP_FILE.sha256"
            MANIFEST_FILE="$BACKUP_DIR/${BASENAME}.txt"

            # Snapshot dos arquivos reais, incluindo alterações locais, sem runtime/secrets.
            CODE_BACKUP="$BACKUP_DIR/${BASENAME}.code.tar.gz"
            tar -czf "$CODE_BACKUP" --exclude='./.git' --exclude='./storage' \
              --exclude='./config/config.php' --exclude='./config/realtime.json' \
              --exclude='./.env' --exclude='./.env.*' --exclude='./realtime-secrets.env' .
            tar -tzf "$CODE_BACKUP" >/dev/null
            cp config/config.php "$BACKUP_DIR/${BASENAME}.config.php"
            chmod 600 "$CODE_BACKUP" "$BACKUP_DIR/${BASENAME}.config.php"

            CNF="$(mktemp)"
            DBNAME_FILE="$(mktemp)"
            PHP_HELPER="$(mktemp --suffix=.php)"
            cleanup(){ rm -f "$CNF" "$DBNAME_FILE" "$PHP_HELPER"; }
            trap cleanup EXIT

            cat > "$PHP_HELPER" <<'PHP'
          <?php
          $c=require $argv[1];
          $db=$c['db']??[];
          $quote=function($v){
              $v=str_replace(["\\","\"","\n","\r"],["\\\\","\\\"","\\n","\\r"],(string)$v);
              return "\"".$v."\"";
          };
          file_put_contents($argv[2],
              "[client]\n".
              "host=".$quote($db['host']??'localhost')."\n".
              "port=".(int)($db['port']??3306)."\n".
              "user=".$quote($db['user']??'')."\n".
              "password=".$quote($db['password']??'')."\n"
          );
          file_put_contents($argv[3],(string)($db['name']??''));
          PHP
            php "$PHP_HELPER" "$DEPLOY_PATH/config/config.php" "$CNF" "$DBNAME_FILE"
            chmod 600 "$CNF"
            DB_NAME="$(cat "$DBNAME_FILE")"
            [ -n "$DB_NAME" ] || { echo "ERRO: nome do banco vazio." >&2; exit 1; }

            DUMP_BIN="$(command -v mysqldump || command -v mariadb-dump || true)"
            [ -n "$DUMP_BIN" ] || { echo "ERRO: mysqldump/mariadb-dump não encontrado." >&2; exit 1; }

            rm -f "$BACKUP_FILE"
            echo "Criando dump completo antes do deploy..." >&2
            "$DUMP_BIN" --defaults-extra-file="$CNF" --no-tablespaces --single-transaction --quick --routines --triggers --events --hex-blob --default-character-set=utf8mb4 "$DB_NAME" | gzip -9 > "$BACKUP_FILE"

            gzip -t "$BACKUP_FILE"
            [ -s "$BACKUP_FILE" ] || { echo "ERRO: backup vazio." >&2; exit 1; }
            set +o pipefail
            if gzip -cd "$BACKUP_FILE" | grep -Eq '^(CREATE TABLE|INSERT INTO|-- MySQL dump|-- MariaDB dump)'; then
              DUMP_VALID=1
            else
              DUMP_VALID=0
            fi
            set -o pipefail
            if [ "$DUMP_VALID" -ne 1 ]; then
              echo "ERRO: conteúdo do dump não parece válido." >&2
              exit 1
            fi
            gzip -cd "$BACKUP_FILE" | tail -n 20 | grep -Eq '^-- Dump completed on |^-- Dump completed ' || { echo "ERRO: dump sem marcador de conclusão." >&2; exit 1; }
            TABLE_COUNT="$(gzip -cd "$BACKUP_FILE" | grep -c '^CREATE TABLE' || true)"
            [ "$TABLE_COUNT" -gt 0 ] || { echo "ERRO: nenhuma tabela encontrada no dump." >&2; exit 1; }

            SCHEMA_VERSION="$(php -r '
              $c=require $argv[1];$d=$c["db"]??[];
              try{
                $pdo=new PDO("mysql:host=".($d["host"]??"localhost").";port=".($d["port"]??3306).";dbname=".$d["name"].";charset=utf8mb4",$d["user"]??"",$d["password"]??"",[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
                $q=$pdo->query("SELECT value FROM settings WHERE `key`=\"schema_version\" LIMIT 1");
                echo (string)($q->fetchColumn()?:"unknown");
              }catch(Throwable $e){echo "unknown";}
            ' "$DEPLOY_PATH/config/config.php")"

            (cd "$BACKUP_DIR" && sha256sum "$(basename "$BACKUP_FILE")" > "$(basename "$SHA_FILE")")
            {
              echo "TaskEsc — backup obrigatório pré-deploy"
              echo "Criado em UTC: $TS"
              echo "Commit em produção antes do deploy: $PROD_COMMIT"
              echo "Schema do banco: $SCHEMA_VERSION"
              echo "Tabelas encontradas: $TABLE_COUNT"
              echo "Inclui: estrutura, dados, triggers, routines e events"
              echo "Arquivo do banco: $(basename "$BACKUP_FILE")"
              echo "Snapshot real do código: $(basename "$CODE_BACKUP")"
              echo "SHA256: $(cut -d' ' -f1 "$SHA_FILE")"
            } > "$MANIFEST_FILE"
            chmod 600 "$BACKUP_FILE" "$SHA_FILE" "$MANIFEST_FILE"
            find "$BACKUP_DIR" -maxdepth 1 -type f -name 'taskesc-predeploy-*' -mtime +30 -delete || true

            printf '%s|%s|%s|%s\n' "$BACKUP_FILE" "$SHA_FILE" "$MANIFEST_FILE" "$PROD_COMMIT"
          REMOTE
          )"

          IFS='|' read -r REMOTE_BACKUP REMOTE_SHA REMOTE_MANIFEST PROD_COMMIT <<< "$RESULT"
          [ -n "$REMOTE_BACKUP" ] && [ -n "$REMOTE_MANIFEST" ] && [ -n "$PROD_COMMIT" ]

          scp -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:$REMOTE_BACKUP" predeploy-backup/
          scp -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:$REMOTE_SHA" predeploy-backup/
          scp -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:$REMOTE_MANIFEST" predeploy-backup/
          scp -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:${REMOTE_BACKUP%.sql.gz}.code.tar.gz" predeploy-backup/

          (cd predeploy-backup && sha256sum -c *.sql.gz.sha256)
          git archive --format=zip --output=predeploy-backup/taskesc-code-predeploy.zip "$PROD_COMMIT"
          sha256sum predeploy-backup/taskesc-code-predeploy.zip > predeploy-backup/taskesc-code-predeploy.zip.sha256
          echo "prod_commit=$PROD_COMMIT" >> "$GITHUB_OUTPUT"
          echo "backup_manifest=$REMOTE_MANIFEST" >> "$GITHUB_OUTPUT"
          echo "Backup validado e copiado para fora da VPS."

      - name: Guardar backup pré-deploy fora da VPS
        uses: actions/upload-artifact@v4
        with:
          name: taskesc-predeploy-${{ github.run_id }}
          path: predeploy-backup/
          if-no-files-found: error
          retention-days: 30

      - name: Preparar configuração realtime privada
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          HELPER="$(ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'umask 077; mktemp /tmp/taskesc-realtime-XXXXXX.py')"
          trap 'ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "rm -f -- $HELPER" >/dev/null 2>&1 || true' EXIT
          scp -P "$VPS_PORT" ops/realtime-step1.py "$VPS_USER@$VPS_HOST:$HELPER"
          printf -v REMOTE_COMMAND 'DEPLOY_PATH=%q HELPER=%q bash -s' "$DEPLOY_PATH" "$HELPER"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "$REMOTE_COMMAND" <<'REMOTE'
            set -euo pipefail
            if [ "$(id -u)" -eq 0 ]; then
              python3 "$HELPER" provision --deploy-path "$DEPLOY_PATH"
            else
              sudo -n python3 "$HELPER" provision --deploy-path "$DEPLOY_PATH"
            fi
          REMOTE

      - name: Atualizar TaskEsc na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -e
          printf -v REMOTE_COMMAND 'DEPLOY_PATH=%q EXPECTED_COMMIT=%q bash -s' "$DEPLOY_PATH" "$EXPECTED_COMMIT"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "$REMOTE_COMMAND" <<'REMOTE'
            set -euo pipefail

            cd "$DEPLOY_PATH"

            if [ ! -d .git ]; then
              echo "ERRO: DEPLOY_PATH não aponta para um repositório Git."
              exit 1
            fi

            echo "Branch atual:"
            git branch --show-current

            echo "Buscando alterações..."
            git fetch origin main

            echo "Atualizando main..."
            git checkout main
            git merge --ff-only "$EXPECTED_COMMIT"
            [ "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT" ] || { echo "ERRO: commit de produção divergente."; exit 1; }

            # Migração Outbox executada na etapa seguinte, após backup validado.

            echo "Commit em produção:"
            git log -1 --oneline

            echo "Validando arquivos principais..."
            php -l public/index.php
            php -l public/api.php
            php -l public/health.php

            echo "Deploy concluído."
          REMOTE

      - name: Instalar SDK oficial Centrifugo local
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_PATH/public/assets/vendor'"
          scp -P "$VPS_PORT"             public/assets/vendor/centrifuge-5.7.4.js             public/assets/vendor/centrifuge-5.7.4.sha256             public/assets/vendor/centrifuge-js.LICENSE             "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/public/assets/vendor/"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cd '$DEPLOY_PATH/public/assets/vendor' && sha256sum -c centrifuge-5.7.4.sha256 && test -s centrifuge-js.LICENSE"

      - name: Aplicar migrações realtime, chat e automações com backup validado
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BACKUP_MANIFEST: ${{ steps.backup.outputs.backup_manifest }}
        run: |
          set -euo pipefail
          printf -v REMOTE_COMMAND 'DEPLOY_PATH=%q BACKUP_MANIFEST=%q bash -s' "$DEPLOY_PATH" "$BACKUP_MANIFEST"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "$REMOTE_COMMAND" <<'REMOTE'
            set -euo pipefail
            cd "$DEPLOY_PATH"
            php bin/migrate-outbox.php "--backup-manifest=$BACKUP_MANIFEST"
            php bin/migrate-chat.php "--backup-manifest=$BACKUP_MANIFEST"
            php bin/migrate-automation.php "--backup-manifest=$BACKUP_MANIFEST"
            php bin/migrate-ai-whatsapp-inbox.php "--backup-manifest=$BACKUP_MANIFEST"
            php bin/migrate-ai-whatsapp-access.php "--backup-manifest=$BACKUP_MANIFEST"
            php bin/migrate-ai-whatsapp-tools.php "--backup-manifest=$BACKUP_MANIFEST"
            php bin/migrate-whatsapp-contacts.php "--backup-manifest=$BACKUP_MANIFEST"
          REMOTE

      - name: Auditoria de integridade sem alterações de dados
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          printf -v REMOTE_COMMAND 'DEPLOY_PATH=%q bash -s' "$DEPLOY_PATH"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "$REMOTE_COMMAND" <<'REMOTE'
            set -euo pipefail
            cd "$DEPLOY_PATH"
            umask 077
            AUDIT_FILE="$DEPLOY_PATH/storage/backups/taskesc-schema30-audit-$(date -u +%Y%m%dT%H%M%SZ).json"
            AUDIT_EXIT=0
            php bin/system-audit.php --strict --offline --expect-schema=30 > "$AUDIT_FILE" || AUDIT_EXIT=$?
            php -r '
              $r=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);
              echo json_encode(["audit"=>["ok"=>$r["ok"],"schema"=>$r["schema"],"critical_count"=>count($r["critical"]),"warning_count"=>count($r["warnings"]),"warning_keys"=>array_column($r["warnings"],"key"),"cleanup_saas"=>$r["cleanup_saas"],"offline"=>$r["offline"]]],JSON_UNESCAPED_SLASHES).PHP_EOL;
            ' "$AUDIT_FILE"
            exit "$AUDIT_EXIT"
          REMOTE

      - name: Instalar worker realtime (Passo 3)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          printf -v REMOTE_COMMAND 'DEPLOY_PATH=%q bash -s' "$DEPLOY_PATH"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "$REMOTE_COMMAND" <<'REMOTE'
            set -euo pipefail
            if [ "$(id -u)" -eq 0 ]; then
              python3 "$DEPLOY_PATH/ops/realtime-step3.py" install --deploy-path "$DEPLOY_PATH"
            else
              sudo -n python3 "$DEPLOY_PATH/ops/realtime-step3.py" install --deploy-path "$DEPLOY_PATH"
            fi
          REMOTE

      - name: Instalar worker de automações
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          printf -v REMOTE_COMMAND 'DEPLOY_PATH=%q bash -s' "$DEPLOY_PATH"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "$REMOTE_COMMAND" <<'REMOTE'
            set -euo pipefail
            if [ "$(id -u)" -eq 0 ]; then
              python3 "$DEPLOY_PATH/ops/automation-worker.py" install --deploy-path "$DEPLOY_PATH"
            else
              sudo -n python3 "$DEPLOY_PATH/ops/automation-worker.py" install --deploy-path "$DEPLOY_PATH"
            fi
          REMOTE

      - name: Instalar worker TaskEsc AI
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
            set -euo pipefail
            if [ "$(id -u)" -eq 0 ]; then
              python3 "$DEPLOY_PATH/ops/ai-whatsapp-worker.py" install --deploy-path "$DEPLOY_PATH"
            else
              sudo -n python3 "$DEPLOY_PATH/ops/ai-whatsapp-worker.py" install --deploy-path "$DEPLOY_PATH"
            fi
          REMOTE

      - name: Health worker TaskEsc AI
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
