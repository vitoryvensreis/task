<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#8057e3">
  <title>TaskEsc · Sem conexão</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(700px 420px at 50% 0,rgba(128,87,227,.18),transparent 60%),#050507;color:#f7f5fb;font-family:Inter,Segoe UI,Arial,sans-serif}.card{width:min(430px,100%);padding:28px;border:1px solid #302a3b;border-radius:20px;background:linear-gradient(180deg,#111019,#0b0a10);box-shadow:0 30px 90px rgba(0,0,0,.45)}.icon{width:58px;height:58px;display:grid;place-items:center;margin-bottom:20px;border-radius:16px;background:#8057e3;font-weight:900;font-size:25px}h1{margin:0 0 8px;font-size:25px}p{margin:0;color:#9d95a8;font-size:14px;line-height:1.65}.bar{width:74px;height:4px;margin:18px 0;border-radius:99px;background:linear-gradient(90deg,#8057e3,#8fd84a,#f9d354)}button{margin-top:22px;width:100%;height:44px;border:1px solid #9a72ef;border-radius:10px;background:#8057e3;color:#fff;font:inherit;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">T</div>
    <h1>Você está sem conexão</h1>
    <div class="bar"></div>
    <p>O TaskEsc precisa de internet para sincronizar demandas, arquivos e atualizações com segurança. Assim que a conexão voltar, tente novamente.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
