services:
  wppconnect:
    container_name: taskesc-wppconnect
    image: wppconnect/wppconnect-server:${WPP_SERVER_TAG:-2.10.27}
    restart: unless-stopped
    environment:
      PORT: "${PORT:-21465}"
      HOST: "${HOST:-https://wppconnect.escotilhaprodutora.com}"
      SECRET_KEY: "${SECRET_KEY}"
      WEBHOOK_URL: "${WEBHOOK_URL:-}"
      TOKEN_STORE_TYPE: "${TOKEN_STORE_TYPE:-file}"
      CUSTOM_USER_DATA_DIR: "${CUSTOM_USER_DATA_DIR:-/usr/src/wpp-server/userDataDir/}"
      MAX_LISTENERS: "${MAX_LISTENERS:-30}"
      MANAGER_ENABLED: "${MANAGER_ENABLED:-false}"
    volumes:
      - wppconnect_tokens:/usr/src/wpp-server/tokens
      - wppconnect_user_data:/usr/src/wpp-server/userDataDir
      - wppconnect_uploads:/usr/src/wpp-server/uploads
      - wppconnect_images:/usr/src/wpp-server/WhatsAppImages
      - wppconnect_logs:/usr/src/wpp-server/log
    ports:
      - "127.0.0.1:${PORT:-21465}:${PORT:-21465}"
    healthcheck:
      test: ["CMD-SHELL","wget -q --spider http://127.0.0.1:${PORT:-21465}/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    stop_grace_period: 30s

volumes:
  wppconnect_tokens:
  wppconnect_user_data:
  wppconnect_uploads:
  wppconnect_images:
  wppconnect_logs:
