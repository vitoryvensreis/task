<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#263a4d">
  <title>TaskEsc · Sem conexão</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(700px 420px at 50% 0,rgba(38,58,77,.22),transparent 60%),#050507;color:#f7f5fb;font-family:Inter,Segoe UI,Arial,sans-serif}.card{width:min(430px,100%);padding:28px;border:1px solid #302a3b;border-radius:20px;background:linear-gradient(180deg,#111019,#0b0a10);box-shadow:0 30px 90px rgba(0,0,0,.45)}.icon{width:58px;height:58px;display:grid;place-items:center;margin-bottom:20px;border-radius:16px;background:#8057e3;font-weight:900;font-size:25px}h1{margin:0 0 8px;font-size:25px}p{margin:0;color:#9d95a8;font-size:14px;line-height:1.65}.bar{width:74px;height:4px;margin:18px 0;border-radius:99px;background:linear-gradient(90deg,#263a4d,#5f7487,#aab4bd)}button{margin-top:22px;width:100%;height:44px;border:1px solid #39536a;border-radius:10px;background:#8057e3;color:#fff;font:inherit;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">T</div>
    <h1>Não foi possível carregar o TaskEsc</h1>
    <div class="bar"></div>
    <p id="connection-status" role="status" aria-live="polite">Estamos verificando a conexão com o servidor. Esta tela pode aparecer quando a rede ou o TaskEsc estão temporariamente indisponíveis.</p>
    <button type="button" id="retry">Verificar conexão novamente</button>
  <script>
    (() => {
      'use strict';
      const status = document.getElementById('connection-status');
      const retry = document.getElementById('retry');
      let busy = false;
      const verify = async () => {
        if (busy) return;
        busy = true;
        retry.disabled = true;
        status.textContent = 'Verificando a conexão com o TaskEsc...';
        try {
          // Check the actual origin, not the browser's often misleading online flag.
          const url = '/health.php?offline_probe=' + Date.now();
          const response = await fetch(url, {cache:'no-store', credentials:'same-origin'});
          if (!response.ok) {
            status.textContent = 'O servidor respondeu, mas está temporariamente indisponível (HTTP ' + response.status + ').';
            return;
          }
          const data = await response.json();
          if (data.status !== 'ok' || data.database !== true) {
            status.textContent = 'A internet está funcionando, mas o TaskEsc ainda não terminou de iniciar.';
            return;
          }
          status.textContent = 'Servidor disponível. Abrindo o TaskEsc...';
          const page = new URL(window.location.href);
          page.searchParams.set('online_retry', String(Date.now()));
          window.location.replace(page.toString());
        } catch (_) {
          status.textContent = 'Não foi possível alcançar o servidor. Confira sua conexão ou aguarde o restabelecimento do site.';
        } finally {
          busy = false;
          retry.disabled = false;
        }
      };
      retry.addEventListener('click', verify);
      window.addEventListener('online', verify);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) verify(); });
      setInterval(() => { if (!document.hidden) verify(); }, 15000);
      verify();
    })();
  </script>
  </main>
</body>
</html>
