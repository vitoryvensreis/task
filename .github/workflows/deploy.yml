name: Deploy TaskEsc

permissions:
  contents: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: taskesc-production
  cancel-in-progress: true

jobs:
  validate:
    name: Validar código
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, curl, openssl, fileinfo, mbstring, zip
          coverage: none

      - name: Validar sintaxe PHP
        run: |
          set -e
          find app bin public -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validar JavaScript
        run: |
          set -e
          node --check public/assets/app.js
          node --check public/assets/ux-v3.js
          node --check public/service-worker.js
          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('public/assets/app.js','utf8');
          const html=fs.readFileSync('public/index.php','utf8');
          if(html.includes('>\\n  <link') || html.includes('</script>\\n  <script')){
            console.error('ERRO: texto literal \\n encontrado entre assets do index.php');
            process.exit(1);
          }
          const bad=[...src.matchAll(/(^|[^$])\$\([^)]*\)\.forEach/g)].map(m=>m[0].trim());
          if(bad.length){
            console.error('ERRO: seletor único $() usado com forEach:',bad);
            process.exit(1);
          }
          if(!src.includes('data-preview-close') || src.includes("x.onclick=()=>openDemand(d.id)")){
            console.error('ERRO: fechamento do preview de arquivos regrediu.');
            process.exit(1);
          }
          NODE

      - name: Gerar ZIP completo
        run: |
          set -e
          rm -f "/tmp/taskesc-v3.26.zip" "taskesc-v3.26.zip"
          zip -qr "/tmp/taskesc-v3.26.zip" . \
            -x '.git/*' \
               'config/config.php' \
               'storage/sessions/*' \
               'storage/logs/*'
          cp "/tmp/taskesc-v3.26.zip" "taskesc-v3.26.zip"

      - name: Publicar ZIP da versão
        uses: actions/upload-artifact@v4
        with:
          name: taskesc-v3.26
          path: taskesc-v3.26.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy na VPS
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Baixar repositório para snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar acesso SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Backup obrigatório pré-deploy
        id: backup
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p predeploy-backup

          RESULT="$(ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
            set -euo pipefail

            cd "$DEPLOY_PATH"
            [ -d .git ] || { echo "ERRO: DEPLOY_PATH não aponta para um repositório Git." >&2; exit 1; }
            [ -f config/config.php ] || { echo "ERRO: config/config.php não encontrado." >&2; exit 1; }

            PROD_COMMIT="$(git rev-parse HEAD)"
            PROD_SHORT="$(git rev-parse --short=12 HEAD)"
            TS="$(date -u +%Y%m%dT%H%M%SZ)"
            BACKUP_DIR="$DEPLOY_PATH/storage/backups"
            mkdir -p "$BACKUP_DIR"
            chmod 700 "$BACKUP_DIR"

            BASENAME="taskesc-predeploy-${TS}-${PROD_SHORT}"
            BACKUP_FILE="$BACKUP_DIR/${BASENAME}.sql.gz"
            SHA_FILE="$BACKUP_FILE.sha256"
            MANIFEST_FILE="$BACKUP_DIR/${BASENAME}.txt"

            CNF="$(mktemp)"
            DBNAME_FILE="$(mktemp)"
            PHP_HELPER="$(mktemp --suffix=.php)"
            cleanup(){ rm -f "$CNF" "$DBNAME_FILE" "$PHP_HELPER"; }
            trap cleanup EXIT

            cat > "$PHP_HELPER" <<'PHP'
          <?php
          $c=require $argv[1];
          $db=$c['db']??[];
          $quote=function($v){
              $v=str_replace(["\\","\"","\n","\r"],["\\\\","\\\"","\\n","\\r"],(string)$v);
              return "\"".$v."\"";
          };
          file_put_contents($argv[2],
              "[client]\n".
              "host=".$quote($db['host']??'localhost')."\n".
              "port=".(int)($db['port']??3306)."\n".
              "user=".$quote($db['user']??'')."\n".
              "password=".$quote($db['password']??'')."\n"
          );
          file_put_contents($argv[3],(string)($db['name']??''));
          PHP
            php "$PHP_HELPER" "$DEPLOY_PATH/config/config.php" "$CNF" "$DBNAME_FILE"
            chmod 600 "$CNF"
            DB_NAME="$(cat "$DBNAME_FILE")"
            [ -n "$DB_NAME" ] || { echo "ERRO: nome do banco vazio." >&2; exit 1; }

            DUMP_BIN="$(command -v mysqldump || command -v mariadb-dump || true)"
            [ -n "$DUMP_BIN" ] || { echo "ERRO: mysqldump/mariadb-dump não encontrado." >&2; exit 1; }

            rm -f "$BACKUP_FILE"
            echo "Criando dump completo antes do deploy..." >&2
            "$DUMP_BIN" --defaults-extra-file="$CNF" --no-tablespaces --single-transaction --quick --routines --triggers --events --hex-blob --default-character-set=utf8mb4 "$DB_NAME" | gzip -9 > "$BACKUP_FILE"

            gzip -t "$BACKUP_FILE"
            [ -s "$BACKUP_FILE" ] || { echo "ERRO: backup vazio." >&2; exit 1; }
            set +o pipefail
            if gzip -cd "$BACKUP_FILE" | grep -Eq '^(CREATE TABLE|INSERT INTO|-- MySQL dump|-- MariaDB dump)'; then
              DUMP_VALID=1
            else
              DUMP_VALID=0
            fi
            set -o pipefail
            if [ "$DUMP_VALID" -ne 1 ]; then
              echo "ERRO: conteúdo do dump não parece válido." >&2
              exit 1
            fi
            gzip -cd "$BACKUP_FILE" | tail -n 20 | grep -Eq '^-- Dump completed on |^-- Dump completed ' || { echo "ERRO: dump sem marcador de conclusão." >&2; exit 1; }
            TABLE_COUNT="$(gzip -cd "$BACKUP_FILE" | grep -c '^CREATE TABLE' || true)"
            [ "$TABLE_COUNT" -gt 0 ] || { echo "ERRO: nenhuma tabela encontrada no dump." >&2; exit 1; }

            SCHEMA_VERSION="$(php -r '
              $c=require $argv[1];$d=$c["db"]??[];
              try{
                $pdo=new PDO("mysql:host=".($d["host"]??"localhost").";port=".($d["port"]??3306).";dbname=".$d["name"].";charset=utf8mb4",$d["user"]??"",$d["password"]??"",[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
                $q=$pdo->query("SELECT value FROM settings WHERE `key`=\"schema_version\" LIMIT 1");
                echo (string)($q->fetchColumn()?:"unknown");
              }catch(Throwable $e){echo "unknown";}
            ' "$DEPLOY_PATH/config/config.php")"

            (cd "$BACKUP_DIR" && sha256sum "$(basename "$BACKUP_FILE")" > "$(basename "$SHA_FILE")")
            {
              echo "TaskEsc — backup obrigatório pré-deploy"
              echo "Criado em UTC: $TS"
              echo "Commit em produção antes do deploy: $PROD_COMMIT"
              echo "Schema do banco: $SCHEMA_VERSION"
              echo "Tabelas encontradas: $TABLE_COUNT"
              echo "Inclui: estrutura, dados, triggers, routines e events"
              echo "Arquivo do banco: $(basename "$BACKUP_FILE")"
              echo "SHA256: $(cut -d' ' -f1 "$SHA_FILE")"
            } > "$MANIFEST_FILE"
            chmod 600 "$BACKUP_FILE" "$SHA_FILE" "$MANIFEST_FILE"
            find "$BACKUP_DIR" -maxdepth 1 -type f -name 'taskesc-predeploy-*' -mtime +30 -delete || true

            printf '%s|%s|%s|%s\n' "$BACKUP_FILE" "$SHA_FILE" "$MANIFEST_FILE" "$PROD_COMMIT"
          REMOTE
          )"

          IFS='|' read -r REMOTE_BACKUP REMOTE_SHA REMOTE_MANIFEST PROD_COMMIT <<< "$RESULT"
          [ -n "$REMOTE_BACKUP" ] && [ -n "$REMOTE_MANIFEST" ] && [ -n "$PROD_COMMIT" ]

          scp -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:$REMOTE_BACKUP" predeploy-backup/
          scp -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:$REMOTE_SHA" predeploy-backup/
          scp -P "$VPS_PORT" "$VPS_USER@$VPS_HOST:$REMOTE_MANIFEST" predeploy-backup/

          (cd predeploy-backup && sha256sum -c *.sql.gz.sha256)
          git archive --format=zip --output=predeploy-backup/taskesc-code-predeploy.zip "$PROD_COMMIT"
          sha256sum predeploy-backup/taskesc-code-predeploy.zip > predeploy-backup/taskesc-code-predeploy.zip.sha256
          echo "prod_commit=$PROD_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Backup validado e copiado para fora da VPS."

      - name: Guardar backup pré-deploy fora da VPS
        uses: actions/upload-artifact@v4
        with:
          name: taskesc-predeploy-${{ github.run_id }}
          path: predeploy-backup/
          if-no-files-found: error
          retention-days: 30

      - name: Atualizar TaskEsc na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
            set -euo pipefail

            cd "$DEPLOY_PATH"

            if [ ! -d .git ]; then
              echo "ERRO: DEPLOY_PATH não aponta para um repositório Git."
              exit 1
            fi

            echo "Branch atual:"
            git branch --show-current

            echo "Buscando alterações..."
            git fetch origin main

            echo "Atualizando main..."
            git checkout main
            git pull --ff-only origin main

            echo "Executando auditoria de integridade e limpeza segura de restos SaaS..."
            php bin/system-audit.php --cleanup-saas --strict

            echo "Commit em produção:"
            git log -1 --oneline

            echo "Validando arquivos principais..."
            php -l public/index.php
            php -l public/api.php
            php -l public/health.php

            echo "Deploy concluído."
          REMOTE

      - name: Health check pós-deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
            set -euo pipefail
            HEALTH_URL="$(php -r '$c=require $argv[1]; echo rtrim((string)($c["base_url"]??""),"/")."/health.php";' "$DEPLOY_PATH/config/config.php")"
            [ -n "$HEALTH_URL" ] || { echo "ERRO: health URL vazia."; exit 1; }

            for attempt in 1 2 3 4 5; do
              RESPONSE="$(curl --fail --silent --show-error --max-time 20 "$HEALTH_URL" 2>/dev/null || true)"
              if [ -n "$RESPONSE" ] && php -r '$j=json_decode($argv[1],true); exit(is_array($j) && ($j["status"]??null)==="ok" && ($j["database"]??false)===true && ($j["installed"]??false)===true ? 0 : 1);' "$RESPONSE"; then
                echo "Health check OK na tentativa $attempt."
                echo "$RESPONSE"
                exit 0
              fi
              echo "Tentativa $attempt/5 falhou. Aguardando 3 segundos..."
              sleep 3
            done

            echo "ERRO: health check pós-deploy falhou."
            exit 1
          REMOTE
