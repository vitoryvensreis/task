name: Deploy TaskEsc

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: taskesc-production
  cancel-in-progress: true

jobs:
  validate:
    name: Validar código
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, curl, openssl, fileinfo, mbstring, zip
          coverage: none

      - name: Validar sintaxe PHP
        run: |
          set -e
          find app bin public -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validar JavaScript
        run: |
          set -e
          node --check public/assets/app.js
          node --check public/assets/ux-v3.js
          node --check public/service-worker.js
          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('public/assets/app.js','utf8');
          const html=fs.readFileSync('public/index.php','utf8');
          if(html.includes('>\\n  <link') || html.includes('</script>\\n  <script')){
            console.error('ERRO: texto literal \\n encontrado entre assets do index.php');
            process.exit(1);
          }
          const bad=[...src.matchAll(/(^|[^$])\$\([^)]*\)\.forEach/g)].map(m=>m[0].trim());
          if(bad.length){
            console.error('ERRO: seletor único $() usado com forEach:',bad);
            process.exit(1);
          }
          NODE

      - name: Gerar ZIP completo
        run: |
          set -e
          rm -f "/tmp/taskesc-v3.13.zip" "taskesc-v3.13.zip"
          zip -qr "/tmp/taskesc-v3.13.zip" . \
            -x '.git/*' \
               'config/config.php' \
               'storage/sessions/*' \
               'storage/logs/*'
          cp "/tmp/taskesc-v3.13.zip" "taskesc-v3.13.zip"

      - name: Publicar ZIP da versão
        uses: actions/upload-artifact@v4
        with:
          name: taskesc-v3.13
          path: taskesc-v3.13.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy na VPS
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Configurar acesso SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Atualizar TaskEsc na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
            set -euo pipefail

            cd "$DEPLOY_PATH"

            if [ ! -d .git ]; then
              echo "ERRO: DEPLOY_PATH não aponta para um repositório Git."
              exit 1
            fi

            echo "Branch atual:"
            git branch --show-current

            echo "Buscando alterações..."
            git fetch origin main

            echo "Atualizando main..."
            git checkout main
            git pull --ff-only origin main

            echo "Commit em produção:"
            git log -1 --oneline

            echo "Validando arquivos principais..."
            php -l public/index.php
            php -l public/api.php

            echo "Deploy concluído com sucesso."
          REMOTE
